services:
  server:
    image: ${APP_IMAGE:-ghcr.io/dolr-ai/marketing-analytics-server}:${IMAGE_TAG:-latest}
    build:
      context: .
      target: final
    restart: unless-stopped
    environment:
      # Server Configuration
      BACKEND: "LIVE"
      RUST_LOG: "info"
      SERVER_PORT: "3000"
      IP_DB_PATH: "/app/ip_db.mmdb"
      # Secrets (passed from environment)
      SERVER_ACCESS_TOKEN: ${SERVER_ACCESS_TOKEN}
      MIXPANEL_PROJECT_TOKEN: ${MIXPANEL_PROJECT_TOKEN}
      GOOGLE_SA_KEY: ${GOOGLE_SA_KEY}
      SENTRY_GOOGLE_CHAT_WEBHOOK_URL: ${SENTRY_GOOGLE_CHAT_WEBHOOK_URL}
      SENTRY_CLIENT_SECRET: ${SENTRY_CLIENT_SECRET}
      IP_TOKEN: ${IP_TOKEN}
      GOOGLE_PUBSUB_KEY: ${GOOGLE_PUBSUB_KEY}
    networks:
      - analytics-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 QUIC support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - analytics-net
    depends_on:
      - server

networks:
  analytics-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
